<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JUMJUM — Nguyễn Văn Cánh, P. Phú Tân, Vĩnh Long</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body data-page="shop">
  <canvas id="particle-canvas"></canvas>

  <div class="app-shell">
    <header class="topbar glass">
      <div>
        <div class="brand-title">JUMJUM</div>
        <div class="brand-sub">Nguyễn Văn Cánh, P. Phú Tân, Vĩnh Long • <span id="live-clock"></span></div>
      </div>

      <div class="controls-row">
        <button id="audio-toggle-btn" class="pill" type="button">♪ Nhạc nền: Bật</button>
        <button id="theme-toggle-btn" class="pill" type="button">🌓 Tự động sáng/tối</button>
        <a href="admin.html" class="pill">⚙️ Quản trị & POS</a>
      </div>
    </header>

    <audio id="bg-audio" src="audio/jumjum shop.mp3" loop preload="metadata"></audio>

    <div class="grid-main">
      <main>
        <section class="section-card glass">
          <div class="section-header">
            <h1 class="section-title">Thực đơn JUMJUM</h1>
            <input id="search-input" class="input" style="max-width: 220px;" type="text" placeholder="Tìm món..." />
          </div>

          <div id="category-filters" class="filter-bar"></div>
          <div id="products-grid" class="products-grid"></div>
        </section>
      </main>

      <aside>
        <section class="section-card glass-strong">
          <div class="section-header">
            <h2 class="section-title">Giỏ hàng (VNĐ)</h2>
            <button id="clear-cart-btn" class="pill danger" type="button">Xóa hết</button>
          </div>

          <div id="cart-list" class="cart-list"></div>

          <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input id="voucher-input" class="input" type="text" placeholder="Mã giảm giá (vd: JUMJUM10)" />
            <button id="apply-voucher-btn" class="pill primary" type="button">Áp dụng</button>
          </div>

          <div class="summary-row">
            <span>Tạm tính</span>
            <span id="subtotal-text">0 ₫</span>
          </div>
          <div class="summary-row">
            <span>Giảm giá</span>
            <span id="discount-text">-0 ₫</span>
          </div>
          <div class="summary-row total">
            <span>Thành tiền</span>
            <span id="total-text">0 ₫</span>
          </div>

          <form id="order-form" style="margin-top: 14px;">
            <div class="form-grid">
              <input id="customer-name" class="input" type="text" placeholder="Họ tên khách hàng *" required />
              <input id="customer-phone" class="input" type="tel" placeholder="Số điện thoại *" required />
            </div>
            <input id="customer-address" class="input" style="margin-bottom: 10px;" type="text" placeholder="Địa chỉ nhận / Ghi chú tại P. Phú Tân, Vĩnh Long" />
            <select id="payment-method" class="select" style="margin-bottom: 12px;">
              <option value="Tiền mặt / Tại quầy">Tiền mặt / Tại quầy</option>
              <option value="Chuyển khoản / QR">Chuyển khoản / QR</option>
            </select>
            <button class="pill primary" style="width: 100%; justify-content: center; padding: 12px;" type="submit">
              Đặt hàng ngay
            </button>
          </form>

          <div id="order-status" class="status-msg"></div>
        </section>

        <section class="section-card glass">
          <div class="section-header">
            <h2 class="section-title">Mã QR nhanh JUMJUM</h2>
          </div>
          <div class="qr-box">
            <canvas id="qr-canvas"></canvas>
            <span class="brand-sub" style="text-align: center;">Quét mã để mở nhanh trang đặt món JUMJUM</span>
            <button id="download-qr-btn" class="pill" type="button">Tải mã QR (.png)</button>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
